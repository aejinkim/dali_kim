name: Design system

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Prop types are strict (Space, AspectRatio, TokenVar). Misuse fails here.
      - run: npm run type-check
      # Token types match globals.css, and no file gains a ds/* lint violation.
      - run: npm run ds:check
